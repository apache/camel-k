# This pipe tests KEDA auto-discovery for an ArkMQ queue:
# - artemis-queue trigger is auto-discovered from the amqp:queue URI
# - management endpoint is derived from the broker url
# - broker name is merged via autoMetadata

apiVersion: camel.apache.org/v1
kind: Pipe
metadata:
  name: keda-arkmq-to-log-auto
  namespace: arkmq
spec:
  source:
    ref:
      kind: ActiveMQArtemisAddress
      apiVersion: broker.amq.io/v1beta1
      name: my-queue
  sink:
    uri: log:info
  traits:
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 1
      cooldownPeriod: 20
      pollingInterval: 10
      autoMetadata:
        artemis-queue:
          brokerName: amq-broker