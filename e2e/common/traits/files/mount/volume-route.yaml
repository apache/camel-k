# Writes a file into the mounted volume and reads it back
- from:
    uri: "timer:mount-volume-write?repeatCount=1"
    steps:
      - setBody:
          simple: "{{volume.message}}"
      - to: "file:{{volume.path}}?fileName=data.txt"
- from:
    uri: "file:{{volume.path}}?fileName=data.txt&noop=true&idempotent=false"
    steps:
      - setBody:
          simple: "volume content is: ${body}"
      - to: "log:info"
