apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: keda-it-activemq-to-log-auto
spec:
  flows:
  - route:
      from:
        steps:
        - to: log:info
        uri: activemq:queue:my-queue
  traits:
    camel:
      properties:
        - camel.component.activemq.broker-url=tcp://my-activemq-hdls-svc.%%%.svc:61616
        - camel.component.activemq.username=admin
        - camel.component.activemq.password=admin
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 1
      cooldownPeriod: 20
      pollingInterval: 10
      triggers:
        - type: activemq
          metadata:
            managementEndpoint: my-activemq-hdls-svc.%%%.svc:8161
            destinationName: my-queue
            brokerName: localhost
          secrets:
            - name: my-activemq-credentials-secret
              mapping:
                ACTIVEMQ_USER: username
                ACTIVEMQ_PASSWORD: password
