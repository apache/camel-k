# Spring RabbitMQ trigger is auto-discovered from the consumer URI (queueName comes from `queues`).
# The broker address is not part of the URI, so host, mode and value are merged via autoMetadata.

apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: keda-it-spring-rabbitmq-to-log-auto
spec:
  flows:
  - beans:
    - name: rabbitConnectionFactory
      type: org.springframework.amqp.rabbit.connection.CachingConnectionFactory
      properties:
        host: my-rabbitmq.%%%.svc
        port: 5672
        username: admin
        password: admin
  - route:
      from:
        uri: spring-rabbitmq:my-exchange?queues=my-queue&routingKey=my-key
        steps:
        - to: log:info
  traits:
    camel:
      properties:
        - camel.component.spring-rabbitmq.connection-factory=#rabbitConnectionFactory
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 1
      cooldownPeriod: 20
      pollingInterval: 10
      autoMetadata:
        rabbitmq:
          host: amqp://admin:admin@my-rabbitmq.%%%.svc:5672/
          mode: QueueLength
          value: "5"
