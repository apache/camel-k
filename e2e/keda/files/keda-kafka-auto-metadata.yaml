apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: keda-kafka-auto-metadata
  namespace: keda
spec:
  sources:
    - content: |
        from("kafka:my-topic?brokers=my-cluster-kafka-bootstrap.keda.svc:9092&groupId=metadata-group")
          .log("${body}");
      name: routes.java
  traits:
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 2
      autoMetadata:
        lagThreshold: "100"
        activationLagThreshold: "10"