# Azure Service Bus topic trigger is auto-discovered from the consumer URI, with the namespace taken
# from the component property. No Service Bus namespace is reachable from the test cluster, so only
# the generated ScaledObject is checked.

apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: keda-it-azure-servicebus-topic-auto-discovery
spec:
  flows:
  - route:
      from:
        uri: azure-servicebus:my-topic?serviceBusType=topic&subscriptionName=my-subscription
        steps:
        - to: log:info
  traits:
    camel:
      properties:
        - camel.component.azure-servicebus.fully-qualified-namespace=my-namespace.servicebus.windows.net
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 1
      cooldownPeriod: 20
      pollingInterval: 10
      # No triggers specified - auto-discovery should create the azure-servicebus scaler
