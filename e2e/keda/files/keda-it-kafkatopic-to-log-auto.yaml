apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: keda-kafka-auto-discovery
spec:
  flows:
  - route:
      from:
        steps:
        - to: log:info
        uri: kafka:my-topic?brokers=my-cluster-kafka-bootstrap.keda.svc:9092&groupId=auto-group
  traits:
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 1
      cooldownPeriod: 20
      pollingInterval: 10
      # No triggers specified - auto-discovery should create kafka scaler