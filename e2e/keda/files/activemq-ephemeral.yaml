apiVersion: v1
kind: Secret
metadata:
  name: my-activemq-credentials-secret
type: Opaque
stringData:
  ACTIVEMQ_USER: admin
  ACTIVEMQ_PASSWORD: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-activemq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-activemq
  template:
    metadata:
      labels:
        app: my-activemq
    spec:
      containers:
        - name: activemq
          image: apache/activemq-classic:5.19.2
          env:
            - name: ACTIVEMQ_OPTS
              value: "-Djetty.host=0.0.0.0"
            - name: ACTIVEMQ_USER
              value: "admin"
            - name: ACTIVEMQ_PASSWORD
              value: "admin"
          ports:
            - containerPort: 61616
              name: openwire
            - containerPort: 8161
              name: console
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 61616
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: my-activemq-hdls-svc
spec:
  selector:
    app: my-activemq
  ports:
    - name: openwire
      port: 61616
      targetPort: 61616
    - name: console
      port: 8161
      targetPort: 8161
