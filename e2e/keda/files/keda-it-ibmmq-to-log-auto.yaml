apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: keda-it-ibmmq-to-log-auto
spec:
  dependencies:
    - camel:jms
    - mvn:com.ibm.mq:com.ibm.mq.jakarta.client:9.4.0.26
  # KEDA reads the scale target's pod template to resolve scaler credentials.
  # The Pod trait merges these Secret-backed variables into the Integration
  # Deployment's "integration" container as well.
  template:
    spec:
      containers:
        - name: integration
          env:
            - name: MQ_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ibmmq-auth
                  key: mqAdminUsername
            - name: MQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ibmmq-auth
                  key: mqAdminPassword
            - name: MQ_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ibmmq-auth
                  key: mqAppUsername
            - name: MQ_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ibmmq-auth
                  key: mqAppPassword
  flows:
    - route:
        from:
          uri: jms:queue:DEV.QUEUE.1
          steps:
            - to: log:ibmmq
  traits:
    camel:
      properties:
        - camel.beans.mqCF=#class:com.ibm.mq.jakarta.jms.MQConnectionFactory
        - camel.beans.mqCF.hostName=ibmmq.keda.svc
        - camel.beans.mqCF.port=1414
        - camel.beans.mqCF.channel=DEV.APP.SVRCONN
        - camel.beans.mqCF.queueManager=QM1
        - camel.beans.mqCF.transportType=1
        - camel.component.jms.connection-factory=#bean:mqCF
        - camel.component.jms.username={{env:MQ_APP_USERNAME}}
        - camel.component.jms.password={{env:MQ_APP_PASSWORD}}
    keda:
      enabled: true
      auto: true
      minReplicaCount: 0
      maxReplicaCount: 1
      cooldownPeriod: 10
      pollingInterval: 5
      autoMetadata:
        ibmmq:
          host: https://ibmmq.keda.svc:9443/ibmmq/rest/v2/admin/action/qmgr/QM1/mqsc
          queueDepth: "1"
          usernameFromEnv: MQ_ADMIN_USERNAME
          passwordFromEnv: MQ_ADMIN_PASSWORD
          unsafeSsl: "true"
