apiVersion: v1
kind: Secret
metadata:
  name: aws-sqs-credentials-secret
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticmq-config
data:
  elasticmq.conf: |
    include classpath("application.conf")

    queues {
      my-queue {
        defaultVisibilityTimeout = 10 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticmq
  template:
    metadata:
      labels:
        app: elasticmq
    spec:
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:latest
          ports:
            - containerPort: 9324
              name: sqs
            - containerPort: 9325
              name: ui
          volumeMounts:
            - name: config
              mountPath: /opt/elasticmq.conf
              subPath: elasticmq.conf
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: elasticmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
spec:
  selector:
    app: elasticmq
  ports:
    - name: sqs
      port: 9324
      targetPort: 9324
    - name: ui
      port: 9325
      targetPort: 9325
