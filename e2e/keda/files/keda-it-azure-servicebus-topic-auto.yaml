apiVersion: v1
kind: Secret
metadata:
  name: azure-servicebus-connection
type: Opaque
stringData:
  connection: "Endpoint=sb://azure-servicebus-emulator.keda.svc.cluster.local;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
  admin-connection: "Endpoint=sb://azure-servicebus-emulator.keda.svc.cluster.local:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
---
apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: keda-it-azure-servicebus-topic-auto
spec:
  flows:
  - route:
      from:
        uri: azure-servicebus:my-topic?serviceBusType=topic&subscriptionName=my-subscription
        steps:
        - to: log:info
  traits:
    environment:
      vars:
      - CAMEL_COMPONENT_AZURE_SERVICEBUS_CONNECTION_STRING=secret:azure-servicebus-connection/connection
      - SERVICEBUS_ADMIN_CONNECTION=secret:azure-servicebus-connection/admin-connection
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 1
      cooldownPeriod: 10
      pollingInterval: 2
      autoMetadata:
        azure-servicebus:
          connectionFromEnv: SERVICEBUS_ADMIN_CONNECTION
          messageCount: "1"
