apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-rabbitmq
  template:
    metadata:
      labels:
        app: my-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-alpine
          env:
            # The default guest user can only connect from localhost
            - name: RABBITMQ_DEFAULT_USER
              value: "admin"
            - name: RABBITMQ_DEFAULT_PASS
              value: "admin"
          ports:
            - containerPort: 5672
              name: amqp
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: my-rabbitmq
spec:
  selector:
    app: my-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
