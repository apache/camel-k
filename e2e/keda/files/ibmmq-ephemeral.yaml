# These credentials are only for the disposable IBM MQ developer broker used
# by the KEDA integration test. The image reads the password keys from
# /run/secrets; they are not passed to the MQ container as environment values.
apiVersion: v1
kind: Secret
metadata:
  name: ibmmq-auth
stringData:
  mqAdminUsername: admin
  mqAdminPassword: admin-passw0rd
  mqAppUsername: app
  mqAppPassword: app-passw0rd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibmmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ibmmq
  template:
    metadata:
      labels:
        app: ibmmq
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: ibmmq
          image: icr.io/ibm-messaging/mq:9.4.0.26-r2
          imagePullPolicy: IfNotPresent
          env:
            - name: LICENSE
              value: accept
            - name: MQ_QMGR_NAME
              value: QM1
            - name: MQ_CONNAUTH_USE_HTP
              value: "true"
          ports:
            - name: mq
              containerPort: 1414
              protocol: TCP
            - name: mqweb
              containerPort: 9443
              protocol: TCP
          startupProbe:
            exec:
              command:
                - chkmqstarted
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - chkmqready
            failureThreshold: 1
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - chkmqhealthy
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: mq-passwords
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: mq-passwords
          secret:
            secretName: ibmmq-auth
            defaultMode: 0444
            items:
              - key: mqAdminPassword
                path: mqAdminPassword
              - key: mqAppPassword
                path: mqAppPassword
---
apiVersion: v1
kind: Service
metadata:
  name: ibmmq
spec:
  selector:
    app: ibmmq
  ports:
    - name: mq
      port: 1414
      targetPort: mq
      protocol: TCP
    - name: mqweb
      port: 9443
      targetPort: mqweb
      protocol: TCP
