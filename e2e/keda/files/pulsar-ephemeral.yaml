apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsar
  template:
    metadata:
      labels:
        app: pulsar
    spec:
      containers:
        - name: pulsar
          image: apachepulsar/pulsar:4.0.4
          # Standalone broker without the stream storage and functions worker, to keep it small.
          command: ["bin/pulsar", "standalone", "-nss", "-nfw"]
          env:
            - name: PULSAR_MEM
              value: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
          ports:
            - containerPort: 6650
              name: broker
            - containerPort: 8080
              name: admin
          readinessProbe:
            httpGet:
              path: /admin/v2/clusters
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar
spec:
  selector:
    app: pulsar
  ports:
    - name: broker
      port: 6650
      targetPort: 6650
    - name: admin
      port: 8080
      targetPort: 8080
