apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-broker
  template:
    metadata:
      labels:
        app: my-broker
    spec:
      containers:
        - name: artemis
          image: apache/artemis:latest-alpine
          env:
            - name: ANONYMOUS_LOGIN
              value: "true"
            - name: EXTRA_ARGS
              value: "--http-host 0.0.0.0 --relax-jolokia --name amq-broker --queues my-queue --allow-anonymous"
          ports:
            - containerPort: 61616
              name: amqp
            - containerPort: 8161
              name: console
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: my-broker-hdls-svc
spec:
  selector:
    app: my-broker
  ports:
    - name: amqp
      port: 61616
      targetPort: 61616
    - name: console
      port: 8161
      targetPort: 8161
