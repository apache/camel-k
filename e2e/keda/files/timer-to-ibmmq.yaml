apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: timer-to-ibmmq
spec:
  dependencies:
    - camel:jms
    - mvn:com.ibm.mq:com.ibm.mq.jakarta.client:9.4.0.26
  template:
    spec:
      containers:
        - name: integration
          env:
            - name: MQ_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ibmmq-auth
                  key: mqAppUsername
            - name: MQ_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ibmmq-auth
                  key: mqAppPassword
  flows:
    - route:
        from:
          uri: timer:foo?period=1000
          steps:
            - setBody:
                constant: "IBM MQ scaler E2E message"
            - to: jms:queue:DEV.QUEUE.1
  traits:
    camel:
      properties:
        - camel.beans.mqCF=#class:com.ibm.mq.jakarta.jms.MQConnectionFactory
        - camel.beans.mqCF.hostName=ibmmq.keda.svc
        - camel.beans.mqCF.port=1414
        - camel.beans.mqCF.channel=DEV.APP.SVRCONN
        - camel.beans.mqCF.queueManager=QM1
        - camel.beans.mqCF.transportType=1
        - camel.component.jms.connection-factory=#bean:mqCF
        - camel.component.jms.username={{env:MQ_APP_USERNAME}}
        - camel.component.jms.password={{env:MQ_APP_PASSWORD}}
