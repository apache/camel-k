apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: timer-to-azure-servicebus-queue
spec:
  flows:
  - route:
      from:
        uri: timer:queue-messages?period=100&repeatCount=100
        steps:
        - setBody:
            constant: "camel-k-keda-azure-servicebus-queue-message"
        - to: azure-servicebus:my-queue?serviceBusType=queue
  traits:
    environment:
      vars:
      - CAMEL_COMPONENT_AZURE_SERVICEBUS_CONNECTION_STRING=secret:azure-servicebus-connection/connection
