apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: keda-it-aws2-sqs-to-log-auto
spec:
  flows:
  - route:
      from:
        steps:
        - to: log:info
        uri: aws2-sqs:my-queue?region=us-east-1&accessKey=test&secretKey=test&overrideEndpoint=true&uriEndpointOverride=http://elasticmq.%%%.svc:9324&autoCreateQueue=true
  traits:
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 1
      cooldownPeriod: 20
      pollingInterval: 10
      # Manual trigger with secrets so KEDA can poll ElasticMQ; metadata matches the aws2-sqs scaler mapping.
      triggers:
        - type: aws-sqs-queue
          metadata:
            queueURL: my-queue
            awsRegion: us-east-1
            awsEndpoint: http://elasticmq.%%%.svc:9324
            queueLength: "1"
          secrets:
            - name: aws-sqs-credentials-secret
              mapping:
                AWS_ACCESS_KEY_ID: awsAccessKeyID
                AWS_SECRET_ACCESS_KEY: awsSecretAccessKey
