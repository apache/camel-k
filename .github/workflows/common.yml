name: common

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CAMEL_K_TEST_TIMEOUT_SHORT: 2m
  CAMEL_K_TEST_TIMEOUT_MEDIUM: 5m
  CAMEL_K_TEST_TIMEOUT_LONG: 10m
  CAMEL_K_TEST_TIMEOUT_VERY_LONG: 30m

on:
  pull_request:
    branches:
      - main
      - "release-*"
    paths-ignore:
      - 'docs/**'
      - 'java/**'
      - 'proposals/**'
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches:
      - main
      - "release-*"
    paths-ignore:
      - 'docs/**'
      - 'java/**'
      - 'proposals/**'
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive

    - name: Infra setting
      uses: ./.github/actions/infra-setting

    - name: Install operator
      shell: bash
      run: |
        kubectl create ns camel
        # the extra configuration is required to run the container registry with secret
        kubectl create configmap camel-k-operator-configmap-configuration \
          --from-literal=ENABLE_DEV_REGISTRY_SECRET="true" \
          --from-literal=MAVEN_REPOSITORIES_ALLOWED="https://maven.repository.redhat.com/ga@id=redhat" \
          -n camel
        # make the test aware that each Integration requires a pull secret
        E2E_TEST_REGISTRY_SECRET_COPY=true
        echo "E2E_TEST_REGISTRY_SECRET_COPY=$E2E_TEST_REGISTRY_SECRET_COPY" >> $GITHUB_ENV
        echo "Setting E2E_TEST_REGISTRY_SECRET_COPY=true in order to automate the copy of the pull secret and the setting in each test"

        kubectl apply -k install/overlays/all-namespaces/ --server-side --force-conflicts
        kubectl wait --for=condition=available deployment/camel-k-operator -n camel --timeout=60s
        # Install Apache Kamelets catalog
        mvn -q dependency:copy -Dartifact=org.apache.camel.kamelets:camel-kamelets:4.22.0:jar -Dmdep.useBaseVersion=true -DoutputDirectory=/tmp
        unzip /tmp/camel-kamelets-4.22.0.jar -d /tmp && kubectl apply -f /tmp/kamelets -n camel

    - name: Run test
      shell: bash
      run: |
        DO_TEST_PREBUILD=false GOTESTFMT="-json 2>&1 | gotestfmt" make test-common

  advanced:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive

    - name: Infra setting
      uses: ./.github/actions/infra-setting

    - name: Install CRDs
      shell: bash
      run: |
        make install-crds

    - name: Run test
      shell: bash
      run: |
        DO_TEST_PREBUILD=false GOTESTFMT="-json 2>&1 | gotestfmt" make test-advanced
