name: network-policy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'pkg/apis/camel/v1/trait/service.go'
      - 'pkg/apis/camel/v1/trait/zz_generated.deepcopy.go'
      - 'pkg/trait/service.go'
      - 'pkg/trait/service_test.go'
      - 'e2e/networkpolicy/network_policy_test.go'
      - 'e2e/networkpolicy/files/NetworkPolicyConsumer.java'
      - '.github/actions/infra-setting/action.yml'
      - '.github/workflows/network-policy.yml'
      - 'script/Makefile'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CAMEL_K_TEST_TIMEOUT_SHORT: 2m
  CAMEL_K_TEST_TIMEOUT_MEDIUM: 5m
  CAMEL_K_TEST_TIMEOUT_LONG: 10m

jobs:
  network-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Infra setting
        uses: ./.github/actions/infra-setting
        with:
          cni: calico

      - name: Install operator
        shell: bash
        run: |
          kubectl create ns camel-k
          kubectl create configmap camel-k-operator-configmap-configuration \
            --from-literal=MAVEN_REPOSITORIES_ALLOWED="https://maven.repository.redhat.com/ga@id=redhat" \
            -n camel-k
          kubectl apply -k install/overlays/all-namespaces/ --server-side --force-conflicts
          kubectl wait --for=condition=available deployment/camel-k-operator -n camel-k --timeout=60s

      - name: Run NetworkPolicy E2E test
        shell: bash
        run: make test-network-policy
