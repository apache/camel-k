name: registry-setting
description: 'Setting registry externally'

runs:
  using: "composite"

  steps:
  - id: registry-settings
    name: Create an auth secured registry
    shell: bash
    run: |
      kubectl create ns registry
      # Create a self-signed certificate
      openssl req -x509 -newkey rsa:2048 -nodes -keyout registry.key -out registry.crt -days 7 -subj "/CN=registry"
      kubectl create secret tls registry-tls --cert=registry.crt --key=registry.key -n registry
      kubectl apply -f .github/actions/ext-registry-setting/registry.yaml -n registry
      kubectl wait --for=condition=available deployment/registry -n registry --timeout=60s
      DEV_REGISTRY="$(kubectl -n registry get service registry -o jsonpath='{.spec.clusterIP}')"

      # Useful if we want to include a registry with authentication (we must uncomment the registry deployment as well)
      # kubectl create secret docker-registry my-registry \
      #   --docker-server $KAMEL_INSTALL_REGISTRY \
      #   --docker-username admin \
      #   --docker-password password \
      #   -n camel-k

      kubectl create configmap camel-k-operator-configmap-configuration \
        --from-literal=REGISTRY_ADDRESS="$DEV_REGISTRY" \
      # Uncomment to provide a push secret
      #  --from-literal=REGISTRY_SECRET="my-registry" \
        -n camel-k
